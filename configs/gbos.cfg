# gbOS86 boot options for HP 15s-fr5009TU (Intel Alder Lake Core i3-1215U)
# SHELL_AT: none | early (before drivers) | pre_android (Android root mounted at /new)
SHELL_AT=none

# Load i915 driver for Intel Alder Lake GT1 UHD Graphics (PCI ID 8086:46b3)
LOAD_I915=1

# Load Intel Wi-Fi driver
LOAD_WIFI=0

# Pause duration before handing over to Android init (0 = instantaneous)
EXTRA_SLEEP=0

# MODE: boot the installed persistent system directly without interactive menu delay
MODE=boot

# Display density (dpi). 180 matches 15.6" 1920x1080 panel well.
DENSITY=180

# Native 1920x1080 display panel
RESOLUTION=

# REQUIRE_AVX=1 (Intel Core i3-1215U has full AVX2 support)
REQUIRE_AVX=1

# Native Intel GPU acceleration (ANGLE / Vulkan on i915)
GPU_SOFTWARE=auto

GPU_VULKAN=auto

# KernelSU manager app install
KSU_MANAGER=1

# Modular driver coldplug from gbos/modules
HWDETECT=1

# Driver options
MODOPTS="mt7921_common.disable_clc=1"

# Bind SHA-NI/VNNI-free libraries if present
[ -f /gbos/gbos/early_patch.sh ] && . /gbos/gbos/early_patch.sh
